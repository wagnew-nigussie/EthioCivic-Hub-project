name: Gondar SmartCivic CI/CD Validation & Verification Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Automated Verification & Omnichannel Testing
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Run Full Omnichannel & Municipal Test Suites
        env:
          NODE_ENV: test
        run: |
          npm test

      - name: Verify Static Assets & Compiled Tailwind CSS
        run: |
          test -f public/app.css
          test -f public/app.js
          test -f public/index.html
          echo "✓ All core client assets verified."

      - name: Verify Municipal Agencies & Navigation Structure
        run: |
          node test_navigation_submenus.js
          node test_municipal_services.js
          node test_admin_portal.js
          echo "✓ All municipal controllers and administrative portals validated."

  docker-build:
    name: Docker Container Build & Healthcheck Verification
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ethiocivic-hub:latest

      - name: Verify Container Run & Ingestion Health
        run: |
          docker run -d --name test-app -p 5000:5000 -e PORT=5000 ethiocivic-hub:latest
          for i in {1..10}; do
            if curl -s -f http://localhost:5000/api/v1/incidents > /dev/null; then
              echo "✓ Docker container verified running healthy on port 5000."
              docker stop test-app && docker rm test-app
              exit 0
            fi
            echo "Waiting for container to boot ($i/10)..."
            sleep 2
          done
          echo "Container failed healthcheck"
          docker logs test-app
          exit 1

  deploy-status:
    name: Continuous Deployment & Cloud Status Verification
    needs: [validate-and-test, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deployment Summary & Verification Notice
        run: |
          echo "=================================================================="
          echo " 🚀 Gondar SmartCivic (EthioCivic-Hub) Continuous Deployment Ready"
          echo "=================================================================="
          echo "Target Production Host: Render Cloud Platform"
          echo "Live Production URL:    https://ethiocivic-hub-project.onrender.com"
          echo "Repository:             https://github.com/wagnew-nigussie/EthioCivic-Hub-project"
          echo "Status:                 All 5 verification suites PASSED (100%)"
          echo "=================================================================="
