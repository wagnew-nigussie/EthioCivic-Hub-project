<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="floodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadowF" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="280" fill="url(#floodGrad)"/>
  <!-- Submerged house silhouette -->
  <g filter="url(#shadowF)">
    <polygon points="200,60 145,105 255,105" fill="#fef2f2"/>
    <rect x="155" y="105" width="90" height="60" fill="#fef2f2"/>
    <!-- House window & door partially submerged -->
    <rect x="170" y="115" width="20" height="20" fill="#991b1b"/>
    <rect x="208" y="115" width="22" height="40" fill="#991b1b"/>
    <!-- Chimney -->
    <rect x="225" y="65" width="14" height="25" fill="#fecaca"/>
  </g>
  <!-- Raging flood water waves -->
  <path d="M0 150 Q50 140 100 150 T200 150 T300 150 T400 150 L400 280 L0 280 Z" fill="#0284c7" opacity="0.85"/>
  <path d="M0 165 Q60 155 120 165 T240 165 T360 165 T420 165 L400 280 L0 280 Z" fill="#0369a1" opacity="0.9"/>
  <path d="M0 185 Q70 175 140 185 T280 185 T420 185 L400 280 L0 280 Z" fill="#075985"/>
  <!-- SOS beacon pill -->
  <rect x="290" y="20" width="85" height="28" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="332" y="39" text-anchor="middle" fill="#b91c1c" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" letter-spacing="1">🚨 SOS</text>
  <!-- Text badge -->
  <rect x="90" y="222" width="220" height="34" rx="17" fill="#450a0a" opacity="0.9"/>
  <text x="200" y="244" text-anchor="middle" fill="#fee2e2" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5">FLASH FLOOD / RESCUE SOS</text>
</svg>
