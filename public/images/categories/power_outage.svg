<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="powerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fef08a" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="400" height="280" fill="url(#powerGrad)"/>
  <!-- Power transmission grid lines -->
  <line x1="0" y1="90" x2="400" y2="90" stroke="#fef3c7" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="120" x2="400" y2="120" stroke="#fef3c7" stroke-width="1" opacity="0.2"/>
  <!-- Pylon tower silhouette -->
  <path d="M120 220 L160 70 L240 70 L280 220 M145 130 L255 130 M135 175 L265 175 M160 70 L240 130 M240 70 L160 130 M145 130 L255 175 M255 130 L145 175" stroke="#451a03" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- Electric lightning bolt -->
  <polygon points="215,45 175,130 210,130 185,205 240,115 200,115" fill="#fef08a" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  <!-- Spark particles -->
  <circle cx="160" cy="110" r="4" fill="#fef08a"/>
  <circle cx="250" cy="120" r="5" fill="#fef08a"/>
  <circle cx="230" cy="180" r="3" fill="#ffffff"/>
  <!-- Text badge -->
  <rect x="100" y="220" width="200" height="34" rx="17" fill="#451a03" opacity="0.85"/>
  <text x="200" y="242" text-anchor="middle" fill="#fef3c7" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="0.5">ELECTRICAL / GRID FAULT</text>
</svg>
