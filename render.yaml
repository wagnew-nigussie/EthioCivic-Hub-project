services:
  - type: web
    name: ethiocivic-hub-project
    runtime: node
    plan: free
    region: frankfurt
    autoDeploy: true
    buildCommand: "echo 'Precompiled production assets verified'"
    startCommand: "node server/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/v1/incidents
