services:
  - type: web
    name: ethiocivic-hub
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: "echo 'Zero npm dependencies required'"
    startCommand: "node server/server.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /api/v1/incidents
